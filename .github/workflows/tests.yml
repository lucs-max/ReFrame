name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          python -m reframe --home ./.ci-home live off
          python -m reframe --home ./.ci-home demo
          python -m reframe --home ./.ci-home rank
          python -m reframe --home ./.ci-home plan 1 --out plan.md
          python -m reframe --home ./.ci-home brainstorm "dog groomers" --count 2
